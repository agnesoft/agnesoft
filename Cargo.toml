[workspace]
resolver = "2"
members = [
    "agbench",
    "agplatform",
    "agtestcheck",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://github.com/agnesoft/agnesoft"
repository = "https://github.com/agnesoft/agnesoft"
documentation = "https://github.com/agnesoft/agnesoft"
readme = "README.md"
categories = ["development-tools"]

[workspace.dependencies]
agbench = { version = "0.4.0", path = "agbench" }
agplatform = { version = "0.4.0", path = "agplatform" }
