[package]
name = "agplatform"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
description = "Platform providing env, fs, request and process infrastructure for production and testing"
keywords = ["build", "test"]
categories.workspace = true
exclude = ["benches"]

[lib]
bench = false

[[bench]]
name = "env"
harness = false

[[bench]]
name = "fs"
harness = false

[[bench]]
name = "process"
harness = false

[[bench]]
name = "request"
harness = false

[features]
default = []
native-tls = ["request", "reqwest/native-tls"]
request = ["dep:http-body-util", "dep:reqwest", "reqwest/blocking"]
testing = []
tls = ["request", "reqwest/default-tls"]
tokio = ["dep:tokio"]

[dependencies]
http-body-util = { version = "0.1", optional = true }
reqwest = { version = "0.13", default-features = false, optional = true }
tokio = { version = "1", default-features = false, features = ["io-util", "process", "sync", "time"], optional = true }

# Path only (no version) so that publishing strips them.
[dev-dependencies]
agbench = { path = "../agbench" }
agplatform = { path = ".", features = ["request", "testing", "tokio"] }
http-body = "1"
tokio = { version = "1", default-features = false, features = ["rt"] }
