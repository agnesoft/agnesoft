name: agnesoft

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

env:
  CHECKOUT_ACTION: actions/checkout@v7
  SCRIPT_ACTION: actions/github-script@v9
  IS_PR: &IS_PR github.event_name == 'pull_request'

jobs:
  title_check:
    runs-on: ubuntu-latest
    if: ${{ *IS_PR && github.event.action != 'synchronize' }}
    steps:
      - uses: ${{ env.CHECKOUT_ACTION }}
        with:
          sparse-checkout: |
            .gitignore
            .github/workflows/title_check.js
      - uses: ${{ env.SCRIPT_ACTION }}
        with:
          script: |
            const script = require('./.github/workflows/title_check.js')
            await script({github, context, core}))
